<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaviField 运行监控</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; font-weight: 600; }
h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.legend label { display: inline-flex; gap: 6px; align-items: center; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border: 1px solid var(--axis); border-radius: 999px; background: var(--surface); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 24px; color: var(--ink2); }
.facts b { color: var(--ink); font-weight: 600; }
.plot { position: relative; width: 100%; }
canvas { display: block; width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--ink2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.swatch { width: 14px; height: 3px; border-radius: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--axis); border-radius: 6px;
  padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.tip div { display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink2); font-weight: 500; }
td.num { text-align: right; }
pre { margin: 0; overflow-x: auto; color: var(--ink2); font: 12px/1.45 ui-monospace, Consolas, monospace; }
details summary { cursor: pointer; color: var(--ink2); }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
<header>
  <h1>运行监控</h1>
  <span id="project" class="note"></span>
  <label>运行 <select id="runs"></select></label>
  <label>残差日志 <select id="logSource"><option value="">自动（最近姿态）</option></select></label>
  <span class="chip" id="state"><span class="dot" id="dot"></span><span id="stateText">读取中</span></span>
  <button id="modeButton" type="button">多运行对比</button>
</header>
<div class="card" id="compareCard" style="display:none">
  <h2>多运行对比（最多 8 个运行，每个运行一条线）</h2>
  <div class="legend" id="compareRuns"></div>
  <p style="margin:8px 0"><label>对比量 <select id="compareQuantity"></select></label></p>
  <div class="plot"><canvas id="compareCanvas" height="320"></canvas><div class="tip" id="compareTip"></div></div>
  <div class="legend" id="compareLegend"></div>
  <div class="note" id="compareNote"></div>
  <table id="compareTable" style="margin-top:8px"></table>
</div>
<div id="single">
<div class="card facts" id="facts"></div>
<div class="card" id="stageCard" style="display:none">
  <h2>流程阶段</h2>
  <div class="note" id="stageSource"></div>
  <table id="stageTable"></table>
</div>
<div class="card">
  <h2>初始残差（纵轴为对数刻度）</h2>
  <div class="plot" id="residualPlot"><canvas id="residual" height="320"></canvas><div class="tip" id="residualTip"></div></div>
  <div class="legend" id="legend"></div>
  <div class="note" id="residualNote"></div>
  <details style="margin-top:8px"><summary>最新数值表</summary><table id="latest"></table></details>
</div>
<div class="card" id="tablesCard" style="display:none">
  <h2>监控量（来自算例的 postProcessing 表，每列一张图）</h2>
  <div class="grid" id="tables"></div>
</div>
<div class="card">
  <details><summary>日志末尾</summary><pre id="log"></pre></details>
</div>
</div>
</main>
<script>
"use strict";
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
const STATES = {
  queued: ['排队中', '--muted', '…'], running: ['计算中', '--s1', '▶'], completed: ['已完成', '--good', '✓'],
  failed: ['失败', '--critical', '✕'], cancelled: ['已取消', '--muted', '■'], unknown: ['状态未知', '--warning', '?']
};
let rid = null, generation = null, keys = [], series = {}, timer = null, lastTables = [], activeSource = null;

function fmt(value) {
  if (value === null || value === undefined) return '—';
  const a = Math.abs(value);
  if (a !== 0 && (a < 1e-3 || a >= 1e5)) return value.toExponential(2);
  return String(+value.toPrecision(4));
}
function esc(text) { const node = document.createElement('span'); node.textContent = text; return node.innerHTML; }

function setup(canvas) {
  const ratio = window.devicePixelRatio || 1, width = canvas.clientWidth, height = +canvas.getAttribute('height');
  canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
  canvas.style.height = height + 'px';
  const ctx = canvas.getContext('2d'); ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  return [ctx, width, height];
}
function ticks(low, high, count) {
  const span = high - low || Math.abs(high) || 1, raw = span / count, power = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * power).find(s => s >= raw), out = [];
  for (let v = Math.ceil(low / step) * step; v <= high + step * 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
// One chart: lines = [{label, color, points:[[x,y],...]}]; log = logarithmic y.
function draw(canvas, lines, log, hoverX) {
  const [ctx, W, H] = setup(canvas), box = {l: 58, r: 16, t: 10, b: 26};
  ctx.clearRect(0, 0, W, H);
  ctx.font = '12px system-ui, sans-serif';
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const line of lines) for (const [x, y] of line.points) {
    if (log && !(y > 0)) continue;
    const v = log ? Math.log10(y) : y;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (v < y0) y0 = v; if (v > y1) y1 = v;
  }
  if (!isFinite(x0)) return null;
  if (x1 === x0) x1 = x0 + 1;
  if (log) { y0 = Math.floor(y0); y1 = Math.ceil(y1); if (y1 === y0) y1 = y0 + 1; }
  else { const pad = (y1 - y0) * .08 || Math.abs(y1) * .05 || 1; y0 -= pad; y1 += pad; }
  const px = x => box.l + (x - x0) / (x1 - x0) * (W - box.l - box.r);
  const py = v => H - box.b - (v - y0) / (y1 - y0) * (H - box.t - box.b);
  ctx.strokeStyle = css('--grid'); ctx.fillStyle = css('--muted'); ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const yTicks = log ? Array.from({length: y1 - y0 + 1}, (_, i) => y0 + i).filter((_, i, a) => i % Math.ceil(a.length / 8) === 0) : ticks(y0, y1, 5);
  for (const v of yTicks) {
    const y = Math.round(py(v)) + .5;
    ctx.beginPath(); ctx.moveTo(box.l, y); ctx.lineTo(W - box.r, y); ctx.stroke();
    ctx.fillText(log ? '1e' + v : fmt(v), box.l - 6, y);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const v of ticks(x0, x1, Math.max(3, Math.floor(W / 110)))) ctx.fillText(fmt(v), px(v), H - box.b + 6);
  ctx.strokeStyle = css('--axis');
  ctx.beginPath(); ctx.moveTo(box.l, H - box.b + .5); ctx.lineTo(W - box.r, H - box.b + .5); ctx.stroke();
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  for (const line of lines) {
    ctx.strokeStyle = line.color; ctx.beginPath();
    let pen = false;
    for (const [x, y] of line.points) {
      if (log && !(y > 0)) { pen = false; continue; }
      const X = px(x), Y = py(log ? Math.log10(y) : y);
      pen ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); pen = true;
    }
    ctx.stroke();
  }
  if (lines.length > 1 && lines.length <= 4) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = css('--ink2');
    const ends = [];
    for (const line of lines) {
      const last = line.points[line.points.length - 1];
      if (last && (!log || last[1] > 0)) ends.push([py(log ? Math.log10(last[1]) : last[1]) - 3, line.label]);
    }
    ends.sort((a, b) => a[0] - b[0]);
    for (let i = 1; i < ends.length; i++) if (ends[i][0] - ends[i - 1][0] < 14) ends[i][0] = ends[i - 1][0] + 14;
    for (const [y, label] of ends) ctx.fillText(label, W - box.r - 2, Math.min(H - box.b - 2, Math.max(box.t + 12, y)));
  }
  if (hoverX !== undefined && hoverX !== null) {
    const X = Math.min(W - box.r, Math.max(box.l, hoverX));
    ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X + .5, box.t); ctx.lineTo(X + .5, H - box.b); ctx.stroke();
    return {x: x0 + (X - box.l) / (W - box.l - box.r) * (x1 - x0), X};
  }
  return {};
}
function nearest(points, x) {
  let lo = 0, hi = points.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; points[mid][0] < x ? lo = mid : hi = mid; }
  return points.length ? (Math.abs(points[lo][0] - x) <= Math.abs(points[hi][0] - x) ? points[lo] : points[hi]) : null;
}
function hover(canvas, tip, getLines, logFlag) {
  const redraw = event => {
    const lines = getLines(), log = typeof logFlag === 'function' ? logFlag() : logFlag;
    if (!event) { draw(canvas, lines, log); tip.style.display = 'none'; return; }
    const rect = canvas.getBoundingClientRect(), at = draw(canvas, lines, log, event.clientX - rect.left);
    if (!at || at.x === undefined) { tip.style.display = 'none'; return; }
    let axis = null;
    const rows = lines.map(line => {
      const point = nearest(line.points, at.x);
      if (!point) return '';
      axis = axis === null ? point[0] : axis;
      return `<div><span class="swatch" style="background:${line.color}"></span>${esc(line.label)}&nbsp;<b>${fmt(point[1])}</b></div>`;
    }).join('');
    tip.innerHTML = `<div style="color:var(--ink2)">步 / 时间 ${fmt(axis)}</div>` + rows;
    tip.style.display = 'block';
    const width = tip.offsetWidth, left = at.X + 12 + width > rect.width ? at.X - width - 12 : at.X + 12;
    tip.style.left = left + 'px'; tip.style.top = '12px';
  };
  canvas.addEventListener('mousemove', redraw);
  canvas.addEventListener('mouseleave', () => redraw(null));
  return () => redraw(null);
}

const residualCanvas = document.getElementById('residual');
const residualLines = () => keys.slice(0, 8).map((key, i) => ({label: key, color: css(SLOTS[i]), points: series[key] || []}));
const redrawResidual = hover(residualCanvas, document.getElementById('residualTip'), residualLines, true);

function renderResidual() {
  redrawResidual();
  const drawn = keys.slice(0, 8);
  document.getElementById('legend').innerHTML = drawn.length > 1 ? drawn.map((key, i) =>
    `<span><span class="swatch" style="background:${css(SLOTS[i])}"></span>${esc(key)}</span>`).join('') : '';
  const note = document.getElementById('residualNote');
  note.textContent = !keys.length ? '日志里还没有读到残差。不是 OpenFOAM 类日志的程序不会有这张图。'
    : keys.length > 8 ? `共 ${keys.length} 个方程，图中画前 8 个，其余见下方数值表。`
    : drawn.length === 1 ? `图中曲线：${drawn[0]}` : '';
  document.getElementById('latest').innerHTML = '<tr><th>方程</th><th>最新初始残差</th><th>步 / 时间</th><th>点数</th></tr>' +
    keys.map(key => { const p = series[key] || [], last = p[p.length - 1];
      return `<tr><td>${esc(key)}</td><td class="num">${last ? fmt(last[1]) : '—'}</td><td class="num">${last ? fmt(last[0]) : '—'}</td><td class="num">${p.length}</td></tr>`; }).join('');
}
function renderTables(tables) {
  lastTables = tables;
  const card = document.getElementById('tablesCard'), host = document.getElementById('tables');
  card.style.display = tables.length ? '' : 'none';
  const wanted = [];
  for (const table of tables) for (const column of table.columns) wanted.push([table.name + ' · ' + column.label, column.points]);
  while (host.children.length > wanted.length) host.lastChild.remove();
  wanted.slice(0, 12).forEach(([title, points], index) => {
    let cell = host.children[index];
    if (!cell) {
      cell = document.createElement('div');
      cell.innerHTML = '<div class="note" style="margin:0 0 4px"></div><div class="plot"><canvas height="170"></canvas><div class="tip"></div></div>';
      host.appendChild(cell);
      cell._points = [];
      cell._redraw = hover(cell.querySelector('canvas'), cell.querySelector('.tip'),
        () => [{label: cell._title, color: css('--s1'), points: cell._points}], false);
    }
    cell._title = title; cell._points = points;
    cell.firstChild.textContent = title + '　末值 ' + fmt(points.length ? points[points.length - 1][1] : null);
    cell._redraw();
  });
}
function renderState(data) {
  const [text, color, icon] = STATES[data.state] || STATES.unknown;
  document.getElementById('dot').style.background = css(color);
  document.getElementById('stateText').textContent = icon + ' ' + text + (data.fatal ? '　⚠ 日志里有致命错误信息' : '');
  const facts = [['程序', data.program], ['当前步 / 时间', fmt(data.last_step)], ['开始', data.started_at], ['结束', data.finished_at],
                 ['退出码', data.exit_code], ['日志', data.log],
                 ['监控表副本', (data.tables_skipped || []).length ? '部分表未保存：' + data.tables_skipped.map(x => x.path + ' (' + x.reason + ')').join('；') : data.tables_source === 'run_partial' || data.tables_source === 'run_unavailable' ? '副本不完整或不可用' : null]];
  document.getElementById('facts').innerHTML = facts.filter(([, v]) => v !== null && v !== undefined && v !== '—')
    .map(([k, v]) => `<span>${k} <b>${esc(String(v))}</b></span>`).join('');
  document.getElementById('log').textContent = (data.recent || []).join('\n');
  const stages = data.stages, card = document.getElementById('stageCard');
  card.style.display = stages ? '' : 'none';
  if (stages) {
    document.getElementById('stageSource').textContent = stages.path + '；运行中阶段时间持续增长';
    document.getElementById('stageTable').innerHTML = '<tr><th>阶段</th><th>状态</th><th>开始</th><th>结束</th><th>秒</th><th>退出码</th></tr>' +
      stages.steps.map(step => `<tr><td>${esc(step.name)}</td><td>${esc(step.state || '')}</td><td>${esc(step.started_at || '')}</td><td>${esc(step.ended_at || '—')}</td><td>${fmt(step.elapsed_seconds)}</td><td>${step.exit_code == null ? '—' : esc(String(step.exit_code))}</td></tr>`).join('');
  }
}
async function refresh() {
  clearTimeout(timer);
  let delay = 300;
  try {
    if (rid) {
      const have = keys.map(key => (series[key] || []).length).join(',');
      const chosen = document.getElementById('logSource').value;
      const response = await fetch(`/api/run?rid=${rid}` + (chosen ? `&source=${encodeURIComponent(chosen)}` : '') + (generation === null ? '' : `&gen=${generation}&have=${have}`));
      if (response.ok) {
        const data = await response.json(), r = data.residuals;
        const selector = document.getElementById('logSource');
        selector.replaceChildren(new Option('自动（最近姿态）', ''));
        for (const path of data.log_sources || []) selector.add(new Option(path, path));
        selector.value = chosen;
        if (activeSource !== data.log) {
          const wasFollowing = generation !== null;
          activeSource = data.log; generation = null; keys = []; series = {};
          if (wasFollowing) { timer = setTimeout(refresh, 0); return; }
        }
        if (r.reset) series = {};
        generation = r.generation; keys = r.keys;
        for (const key of keys) series[key] = (series[key] || []).concat(r.points[key] || []);
        renderState(data); renderResidual(); renderTables(data.tables || []);
        delay = ['completed', 'failed', 'cancelled'].includes(data.state) ? 5000 : (data.stages ? 500 : 300);
      }
    }
  } catch (error) { document.getElementById('stateText').textContent = '监控服务没有响应'; }
  timer = setTimeout(refresh, delay);
}
async function loadRuns() {
  let delay = 700;
  try {
    const data = await (await fetch('/api/runs')).json(), select = document.getElementById('runs');
    document.getElementById('project').textContent = '项目 ' + data.project;
    const current = select.value;
    select.innerHTML = data.runs.slice().reverse().map(run =>
      `<option value="${run.rid}">${run.rid} · ${esc(run.program || '')} · ${(STATES[run.state] || STATES.unknown)[0]}</option>`).join('');
    if (!data.runs.length) { document.getElementById('stateText').textContent = '这个项目还没有运行'; return; }
    delay = 5000;
    if (current && data.runs.some(run => run.rid === current)) select.value = current;
    if (select.value !== rid) { rid = select.value; generation = null; activeSource = null; keys = []; series = {}; document.getElementById('logSource').value = ''; refresh(); }
    compare.runs = data.runs; renderCompareRuns();
  } catch (error) { /* keep the last list */ }
  finally { setTimeout(loadRuns, delay); }
}

// Compare view: one line per run for a single chosen quantity.
const compare = {on: false, runs: [], slots: {}, data: {}, quantity: null, timer: null};
const compareCanvas = document.getElementById('compareCanvas');
function compareSelected() { return Object.keys(compare.slots).sort((a, b) => compare.slots[a] - compare.slots[b]); }
function comparePoints(rid) {
  const item = compare.data[rid], q = compare.quantity;
  if (!item || !q) return [];
  return q.startsWith('residual:') ? (item.residuals[q.slice(9)] || []) : (item.tables[q] || []);
}
const compareLines = () => compareSelected().map(rid =>
  ({label: rid, color: css(SLOTS[compare.slots[rid]]), points: comparePoints(rid)}));
const redrawCompare = hover(compareCanvas, document.getElementById('compareTip'), compareLines,
  () => !!compare.quantity && compare.quantity.startsWith('residual:'));
function renderCompareRuns() {
  const host = document.getElementById('compareRuns'), full = Object.keys(compare.slots).length >= 8;
  host.innerHTML = compare.runs.slice().reverse().map(run => {
    const on = run.rid in compare.slots;
    return `<label><input type="checkbox" value="${run.rid}" ${on ? 'checked' : ''} ${!on && full ? 'disabled' : ''}>` +
      `${run.rid} · ${esc(run.program || '')} · ${(STATES[run.state] || STATES.unknown)[0]}</label>`;
  }).join('');
}
function renderCompare() {
  const selected = compareSelected(), names = [];
  for (const rid of selected) {
    const item = compare.data[rid];
    if (!item) continue;
    for (const key of Object.keys(item.residuals)) if (!names.includes('residual:' + key)) names.push('residual:' + key);
    for (const key of Object.keys(item.tables)) if (!names.includes(key)) names.push(key);
  }
  if (!names.includes(compare.quantity)) compare.quantity = names[0] || null;
  const select = document.getElementById('compareQuantity');
  select.innerHTML = names.map(name => `<option value="${esc(name)}">${esc(name.startsWith('residual:') ? '初始残差 ' + name.slice(9) : name)}</option>`).join('');
  if (compare.quantity) select.value = compare.quantity;
  redrawCompare();
  document.getElementById('compareLegend').innerHTML = selected.length > 1 ? selected.map(rid =>
    `<span><span class="swatch" style="background:${css(SLOTS[compare.slots[rid]])}"></span>${rid}</span>`).join('') : '';
  const isTable = compare.quantity && !compare.quantity.startsWith('residual:'), byCase = {};
  for (const rid of selected) { const c = (compare.data[rid] || {}).caseDir; if (c) (byCase[c] = byCase[c] || []).push(rid); }
  const shared = Object.values(byCase).filter(group => group.length > 1);
  const incomplete = selected.filter(rid => (compare.data[rid] || {}).incomplete);
  document.getElementById('compareNote').textContent = !selected.length ? '勾选两个或更多运行开始对比。'
    : !names.length ? '所选运行还没有可对比的残差或监控表。'
    : isTable && shared.length ? `注意：${shared.map(g => g.join('、')).join('；')} 共用同一个算例文件夹，监控表是同一份，这几条线不能区分各自的运行。`
    : isTable && Object.keys(byCase).length ? '部分运行没有随运行保存的监控表，读的是算例文件夹当前内容。' : '';
  if (incomplete.length) document.getElementById('compareNote').textContent += ' 监控表副本不完整或不可用：' + incomplete.join('、');
  if (compare.quantity && compare.quantity.startsWith('residual:')) document.getElementById('compareNote').textContent +=
    ' 各运行取最近姿态日志：' + selected.map(id => id + ' ' + ((compare.data[id] || {}).log || '未取得')).join('；');
  let first = null;
  document.getElementById('compareTable').innerHTML = !selected.length ? '' :
    '<tr><th>运行</th><th>程序</th><th>状态</th><th>末值</th><th>步 / 时间</th><th>末值相对第一个运行</th></tr>' + selected.map(rid => {
      const item = compare.data[rid] || {}, p = comparePoints(rid), last = p[p.length - 1];
      const isFirst = first === null && !!last;
      if (isFirst) first = last[1];
      const done = ['completed', 'failed', 'cancelled'].includes(item.state);
      const diff = !isTable ? '残差不比较末值' : !last || first === null ? '—' : isFirst ? '基准'
        : !done ? '计算中，暂不比较' : first !== 0 ? ((last[1] - first) / Math.abs(first) * 100).toPrecision(3) + '%' : '—';
      return `<tr><td><span class="swatch" style="display:inline-block;background:${css(SLOTS[compare.slots[rid]])}"></span> ${rid}</td><td>${esc(item.program || '')}</td>` +
        `<td>${(STATES[item.state] || STATES.unknown)[0]}</td><td class="num">${last ? fmt(last[1]) : '—'}</td><td class="num">${last ? fmt(last[0]) : '—'}</td><td class="num">${diff}</td></tr>`;
    }).join('');
}
async function refreshCompare() {
  clearTimeout(compare.timer);
  if (!compare.on) return;
  let delay = 10000;
  for (const rid of compareSelected()) {
    try {
      const response = await fetch(`/api/run?rid=${rid}`);
      if (!response.ok) continue;
      const data = await response.json(), tables = {};
      for (const table of data.tables || []) for (const column of table.columns) tables[table.name + ' · ' + column.label] = column.points;
      compare.data[rid] = {state: data.state, program: data.program, log: data.log, caseDir: data.tables_source === 'case' ? data.case : null, incomplete: ['run_partial', 'run_unavailable'].includes(data.tables_source), residuals: data.residuals.points, tables};
      if (data.state === 'running' || data.state === 'queued') delay = 3000;
    } catch (error) { /* keep the last data for this run */ }
  }
  renderCompare();
  compare.timer = setTimeout(refreshCompare, delay);
}
document.getElementById('compareRuns').addEventListener('change', event => {
  const id = event.target.value;
  if (event.target.checked) {
    const used = new Set(Object.values(compare.slots));
    for (let slot = 0; slot < 8; slot++) if (!used.has(slot)) { compare.slots[id] = slot; break; }
  } else { delete compare.slots[id]; delete compare.data[id]; }
  renderCompareRuns(); refreshCompare();
});
document.getElementById('compareQuantity').addEventListener('change', event => { compare.quantity = event.target.value; renderCompare(); });
document.getElementById('modeButton').addEventListener('click', () => {
  compare.on = !compare.on;
  document.getElementById('compareCard').style.display = compare.on ? '' : 'none';
  document.getElementById('single').style.display = compare.on ? 'none' : '';
  document.getElementById('modeButton').textContent = compare.on ? '返回单个运行' : '多运行对比';
  if (compare.on) { renderCompareRuns(); refreshCompare(); } else { clearTimeout(compare.timer); renderResidual(); renderTables(lastTables); }
});
document.getElementById('runs').addEventListener('change', event => {
  rid = event.target.value; generation = null; activeSource = null; keys = []; series = {}; document.getElementById('logSource').value = ''; refresh();
});
document.getElementById('logSource').addEventListener('change', () => { generation = null; activeSource = null; keys = []; series = {}; refresh(); });
window.addEventListener('resize', () => { if (compare.on) redrawCompare(); else { renderResidual(); renderTables(lastTables); } });
loadRuns();
</script>
</body>
